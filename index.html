<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수도 내신분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
body { margin: 0 }
/* 레이아웃: 왼쪽 진녹색 메뉴 + 오른쪽 작업 영역. 로고의 진녹색이 기준, 금색은 '등급을 가르는 것'에만 쓴다 */
:root {
  --bg: #F5F4EF; --surface: #FFFFFF; --surface-2: #F1F4F2; --line: #E1E7E4; --line-2: #CDD6D2;
  --fg: #18211F; --fg-2: #3F4B47; --muted: #56635F;
  --brand: #0A4844; --brand-fg: #FFFFFF; --brand-soft: #E3F0EC;
  --gold: #9A6A1F; --gold-soft: #F6EBD6; --gold-fg: #6B4A12;
  --side: #0A4844; --side-fg: #DCE8E4; --side-mute: #9FC0B8; --side-on: #F5F4EF; --side-on-fg: #0A4844; --side-card: #0E5752;
  --d1: #CFE5DF; --d2: #8FC4B7; --d3: #2E7566; --d4: #9A6A1F;
  --b-u: #DDECE8; --b-c: #8FC4B7; --b-r: #C9A867; --b-p: #0A4844; --b-p-fg: #FFFFFF;
  --warn-soft: #FBF5EA; --hi: #18211F;
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1715; --surface: #15211E; --surface-2: #1B2A26; --line: #263733; --line-2: #344843;
  --fg: #E7EEEB; --fg-2: #C3D0CB; --muted: #93A49F;
  --brand: #7CC2B2; --brand-fg: #08201D; --brand-soft: #1E3732;
  --gold: #D9B46A; --gold-soft: #3A3020; --gold-fg: #EBCF93;
  --side: #08201D; --side-fg: #C9DCD6; --side-mute: #7FA59B; --side-on: #1E3732; --side-on-fg: #E7EEEB; --side-card: #10302C;
  --d1: #31504A; --d2: #4E8F82; --d3: #8FD0C1; --d4: #D9B46A;
  --b-u: #31504A; --b-c: #4E8F82; --b-r: #B9944F; --b-p: #8FD0C1; --b-p-fg: #08201D;
  --warn-soft: #2E2819; --hi: #F5F4EF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1715; --surface: #15211E; --surface-2: #1B2A26; --line: #263733; --line-2: #344843;
  --fg: #E7EEEB; --fg-2: #C3D0CB; --muted: #93A49F;
  --brand: #7CC2B2; --brand-fg: #08201D; --brand-soft: #1E3732;
  --gold: #D9B46A; --gold-soft: #3A3020; --gold-fg: #EBCF93;
  --side: #08201D; --side-fg: #C9DCD6; --side-mute: #7FA59B; --side-on: #1E3732; --side-on-fg: #E7EEEB; --side-card: #10302C;
  --d1: #31504A; --d2: #4E8F82; --d3: #8FD0C1; --d4: #D9B46A;
  --b-u: #31504A; --b-c: #4E8F82; --b-r: #B9944F; --b-p: #8FD0C1; --b-p-fg: #08201D;
  --warn-soft: #2E2819; --hi: #F5F4EF; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.55 }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.app { display: flex; flex-wrap: wrap; min-height: 100vh }
.side { flex: 1 1 240px; max-width: 256px; background: var(--side); color: var(--side-fg); padding: 24px 16px; display: flex; flex-direction: column; gap: 22px }
.side img { width: 188px; height: auto; display: block }
.side .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--gold) }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a { display: flex; justify-content: space-between; align-items: center; min-height: 42px; padding: 0 12px; border-radius: 10px; color: var(--side-fg); text-decoration: none; font-weight: 500 }
.nav a:hover { background: var(--side-card) }
.nav a.on { background: var(--side-on); color: var(--side-on-fg); font-weight: 700 }
.nav a .soon { font-size: 11px; color: var(--side-mute); font-weight: 400 }
.side .note { margin-top: auto; background: var(--side-card); border-radius: 10px; padding: 12px; font-size: 12px; color: var(--side-fg); line-height: 1.6 }
.main { flex: 999 1 620px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 18px }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px }
.head .kicker { font-size: 13px; color: var(--muted) }
h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.02em; color: var(--brand); text-wrap: balance }
h2 { margin: 0; font-size: 16px; font-weight: 700; text-wrap: balance }
h2 small { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 6px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column }
.tile b { font-size: 26px; font-weight: 900; color: var(--brand); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.tile span { font-size: 12px; color: var(--muted) }
.tile.dark { background: var(--brand); border-color: var(--brand) }
.tile.dark b, .tile.dark span { color: var(--brand-fg) }
.filters { display: flex; flex-direction: column; gap: 10px }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px }
.frow > .lab { width: 44px; font-size: 12.5px; font-weight: 700; color: var(--muted) }
.chip { min-height: 34px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 13px; color: var(--fg-2) }
.chip:hover { border-color: var(--brand) }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); font-weight: 700 }
select, input[type=search] { min-height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); padding: 0 10px }
input[type=search] { flex: 1 1 220px; min-width: 0 }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface) }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; font-weight: 700; color: var(--fg-2); background: var(--surface-2); padding: 10px 12px; white-space: nowrap; font-size: 12.5px }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: middle }
tbody tr.row { cursor: pointer }
tbody tr.row:hover td { background: var(--surface-2) }
tbody tr.row.open td { background: var(--brand-soft) }
.num { font-variant-numeric: tabular-nums }
.sch { font-weight: 700; color: var(--brand); white-space: nowrap }
.tags { display: flex; gap: 4px; flex-wrap: wrap }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap }
.tag.on { background: var(--brand-soft); color: var(--brand); font-weight: 700 }
.pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; display: inline-block }
.pill.ok { background: var(--brand-soft); color: var(--brand) }
.pill.raw { background: var(--surface-2); color: var(--muted); font-weight: 500 }
.pill.warn { background: var(--gold-soft); color: var(--gold-fg) }
.dbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; width: 170px; max-width: 100% }
.dbar i { display: block; height: 100% }
.dl { font-size: 11px; color: var(--muted); white-space: nowrap }
.dsw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--fg-2) }
.more { align-self: center; min-height: 40px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--brand); background: var(--surface); color: var(--brand); font-weight: 700; cursor: pointer }
.detail td { background: var(--surface-2); padding: 16px 18px }
.det { display: flex; flex-wrap: wrap; gap: 18px }
.det > div:first-child { flex: 1 1 260px; max-width: 420px }
.det > div { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px }
.files { display: flex; flex-direction: column; gap: 4px }
.file { display: flex; align-items: center; gap: 8px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px }
.file .ext { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: var(--brand); color: var(--brand-fg); text-transform: uppercase }
.file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.file .rl { color: var(--muted); white-space: nowrap }
.copy { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; font-size: 11.5px; padding: 3px 8px; cursor: pointer; white-space: nowrap }
.itbl { font-size: 12.5px }
.itbl td, .itbl th { padding: 5px 8px; white-space: nowrap }
.itbl td:last-child, .itbl td:nth-last-child(2) { white-space: normal; min-width: 140px }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0 }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px }
.grid2 > * { min-width: 0 }
.map { display: flex; flex-direction: column; gap: 6px; overflow-x: auto }
.maprow { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; min-width: 560px }
.maprow .lb { font-size: 12.5px; font-weight: 700 }
.cells { display: grid; gap: 3px }
.cell { height: 26px; border-radius: 4px; position: relative }
.cell.hi { box-shadow: inset 0 0 0 2.5px var(--hi) }
.cell.es::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 99px; background: var(--surface) }
.cnum { font-size: 10.5px; color: var(--muted); text-align: center }
.habit { display: flex; gap: 10px; align-items: baseline; font-size: 14px }
.habit .k { flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--gold-soft); color: var(--gold-fg) }
.cov { width: auto; border-collapse: separate; border-spacing: 3px; font-size: 12px }
.cov th { background: none; padding: 2px 6px; font-weight: 500; color: var(--muted) }
.cov td { border: 0; padding: 0; text-align: center; width: 54px; height: 26px; border-radius: 5px; font-size: 11px; font-weight: 700 }
.cov td.c-a { background: var(--brand); color: var(--brand-fg) }
.cov td.c-p { background: var(--d1); color: var(--fg) }
.cov td.c-x { background: var(--surface-2); color: var(--muted); font-weight: 400 }
.cov td.c-n { background: transparent; border: 1px dashed var(--line-2) }
.bars { display: flex; align-items: flex-end; gap: 14px; height: 170px; border-bottom: 1px solid var(--line-2); padding: 0 6px }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0 }
.bars .b i { display: block; width: 100%; max-width: 64px; border-radius: 6px 6px 0 0; background: var(--d3) }
.bars .b.me i { background: var(--brand) }
.bars .b b { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--brand) }
.blabels { display: flex; gap: 14px; padding: 0 6px }
.blabels span { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); min-width: 0 }
.stack { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center }
.stack .s { display: flex; height: 24px; border-radius: 6px; overflow: hidden; font-size: 11px; font-weight: 700 }
.stack .s i { display: flex; align-items: center; justify-content: center; font-style: normal; min-width: 0; overflow: hidden }
.typelist { display: flex; flex-direction: column }
.typelist .t { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line) }
.typelist .t:first-child { border-top: 0 }
.typelist .t .nm { font-weight: 500 }
.typelist .t .where { grid-column: 1 / -1; font-size: 12px; color: var(--muted) }
.typelist .t .cnt { font-weight: 900; color: var(--brand); font-variant-numeric: tabular-nums }
.callout { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--fg-2) }
.tree { display: flex; flex-direction: column; gap: 14px }
.mid h3 { margin: 0 0 6px; font-size: 14px; color: var(--brand) }
.mid h3 span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px }
.trow { display: grid; grid-template-columns: 120px 1fr minmax(0, 1.2fr); gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px }
.trow code { font-family: var(--mono); font-size: 11.5px; color: var(--muted) }
.trow.gap { color: var(--muted) }
.trow .w { font-size: 12px; color: var(--muted) }
.soonbox { max-width: 640px }
.gate { max-width: 560px; gap: 14px }
.gate p { margin: 0 }
.primary { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: var(--brand); color: var(--brand-fg); font-weight: 700; cursor: pointer }
.primary.sm { min-height: 34px; padding: 0 14px; font-size: 13px }
.linkbtn { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0 4px; font-size: inherit }
.tname { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: inherit; font-size: 13px; border-bottom: 1px dashed var(--line-2) }
.trow.gap .tname { color: var(--muted) }
.tedit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.tedit input { flex: 1 1 200px; min-width: 0; min-height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); padding: 0 8px }
@media (max-width: 760px) {
  .side { max-width: none; flex-basis: 100%; padding: 14px 16px; gap: 10px }
  .side img { width: 150px }
  .nav { flex-direction: row; flex-wrap: wrap }
  .nav a { min-height: 36px; font-size: 13px }
  .nav a .soon, .side .note, .side .eyebrow { display: none }
  .trow { grid-template-columns: 1fr; gap: 2px }
}
@media (prefers-reduced-motion: no-preference) { .row td { transition: background .12s } }
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <img src="assets/logo-white.svg" alt="수학도서관 1:1 명품 맞춤 수학학원">
    <div class="eyebrow">수도 내신분석</div>
    <nav class="nav" id="nav" aria-label="메뉴">
      <a href="#archive" data-v="archive">시험지 보관함</a>
      <a href="#school" data-v="school">학교별 분석</a>
      <a href="#types" data-v="types">단원 · 유형 목록</a>
      <a href="#register" data-v="register">시험 등록 <span class="soon">4단계</span></a>
      <a href="#output" data-v="output">분석지 만들기 <span class="soon">3단계</span></a>
      <a href="#factory" data-v="factory">문제 제작소 <span class="soon">5단계</span></a>
    </nav>
    <div class="note" id="sideNote"></div>
  </aside>
  <main class="main" id="main"></main>
</div>


<script>
window.startApp = function (D, ctx) {
  const ROOT_WIN = 'N:\\공유\\공유받은\\2026 중등부\\A. 내신대비\\B. 학교별 기출문제\\';
  const MAIN4 = ['목운중', '신목중', '양정중', '월촌중'];
  const DIFF = ['', '기본', '응용', '실력', '심화'];
  const BEH = { U: '이해', C: '계산', R: '추론', P: '문제해결' };
  const ROLE = { P: '시험지', PA: '시험지+정답', A: '정답', S: '정답배점표', R: '서술형 채점기준', I: '문항정보표' };
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const short = s => s.replace(/중$/, '');
  const examLabel = e => `${e.g}학년 ${e.t}학기 ${e.x}`;
  const A = D.analyzed;
  D.exams.forEach(e => { e.an = A[e.id] || null; });
  const schools = [...new Set(D.exams.map(e => e.s))].sort((a, b) =>
    (MAIN4.includes(b) - MAIN4.includes(a)) || a.localeCompare(b, 'ko'));
  const years = [...new Set(D.exams.map(e => e.y))].sort((a, b) => b - a);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sudo.' + k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem('sudo.' + k, JSON.stringify(v)); } catch (_) {} }
  };

  // ---------- 공통 계산 ----------
  function diffCounts(items) { const c = [0, 0, 0, 0, 0]; items.forEach(i => c[i[2]]++); return c; }
  function diffBar(items) {
    const c = diffCounts(items), n = items.length;
    return `<div class="dbar" role="img" aria-label="기본 ${c[1]}, 응용 ${c[2]}, 실력 ${c[3]}, 심화 ${c[4]}">${[1, 2, 3, 4].filter(k => c[k]).map(k =>
      `<i style="flex:${c[k]};background:var(--d${k})"></i>`).join('')}</div>
      <div class="dl">기본 ${c[1]} · 응용 ${c[2]} · 실력 ${c[3]} · 심화 ${c[4]}</div>`;
  }
  function copyText(btn, text) {
    const done = () => { const o = btn.textContent; btn.textContent = '복사됨'; setTimeout(() => btn.textContent = o, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallback());
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (_) { btn.textContent = '직접 복사'; }
      ta.remove();
    }
  }

  // ---------- 1. 시험지 보관함 ----------
  const F = Object.assign({ school: '전체', course: '전체', year: '전체', exam: '전체', state: '전체', q: '', limit: 40, open: null }, store.get('archive', {}));
  F.limit = 40;
  function filtered() {
    const q = F.q.trim();
    return D.exams.filter(e => {
      if (F.school === '4개교' && !e.m) return false;
      if (F.school === '기타 학교' && e.m) return false;
      if (!['전체', '4개교', '기타 학교'].includes(F.school) && e.s !== F.school) return false;
      if (F.course !== '전체' && `${e.g}-${e.t}` !== F.course) return false;
      if (F.year !== '전체' && String(e.y) !== F.year) return false;
      if (F.exam !== '전체' && e.x !== F.exam) return false;
      if (F.state === '분석 완료' && !e.an) return false;
      if (F.state === '분석 전' && (e.an || !e.p)) return false;
      if (F.state === '정답 없음' && e.a) return false;
      if (F.state === '원본 없음' && e.p) return false;
      if (q) {
        const hay = [e.s, e.y, examLabel(e), `${e.g}-${e.t}`, e.fl.map(f => f[0]).join(' '),
          e.an ? e.an.items.map(i => i[6] + ' ' + i[7]).join(' ') : ''].join(' ');
        if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
      }
      return true;
    }).sort((a, b) => b.y - a.y || (b.m - a.m) || a.s.localeCompare(b.s, 'ko') || a.g - b.g || a.t - b.t || (a.x === '기말') - (b.x === '기말'));
  }
  function stateOf(e) {
    if (e.an) return '<span class="pill ok">분석 완료</span>';
    if (!e.p) return '<span class="pill warn">원본 없음</span>';
    return '<span class="pill raw">분석 전</span>';
  }
  function chips(name, opts) {
    return opts.map(o => `<button type="button" class="chip" data-f="${name}" data-v="${esc(o)}" aria-pressed="${F[name] === o}">${esc(o)}</button>`).join('');
  }
  function renderArchive() {
    const rows = filtered();

  function schoolStats(s) {
    const ex = D.exams.filter(e => e.s === s && e.an).sort((a, b) => a.y - b.y || a.g - b.g || a.t - b.t || (a.x === '기말') - (b.x === '기말'));
    if (!ex.length) return null;
    const per = ex.map(e => {
      const it = e.an.items, n = it.length;
      const maxP = Math.max(...it.map(i => i[1]));
      const top = it.filter(i => i[3] !== undefined && i[2] >= 3).reduce((s, i) => s + i[1], 0);
      const deep = it.filter(i => i[2] === 4).map(i => i[0]);
      const objMax = Math.max(...it.filter(i => !i[9]).map(i => i[1]));
      const beh = { U: 0, C: 0, R: 0, P: 0 }; it.forEach(i => { if (beh[i[3]] !== undefined) beh[i[3]] += i[1]; });
      const bigs = {}; it.forEach(i => { if (i[5]) bigs[i[5]] = (bigs[i[5]] || 0) + i[1]; });
      const topBig = Object.entries(bigs).sort((a, b) => b[1] - a[1])[0];
      const essayPts = it.filter(i => i[9]).reduce((s, i) => s + i[1], 0);
      return { e, n, maxP, objMax, nObjMax: it.filter(i => !i[9] && i[1] === objMax).length, top, deep,
        deepLate: deep.length && deep.every(no => no > n - 3 - e.an.essay) ? 1 : 0, beh, topBig, essay: e.an.essay, essayPts };
    });
    return { ex, per };

  function habits(s, st) {

    out.push(['형식', objOnly ? `분석한 ${N}번 모두 서술형 없이 객관식만 출제했습니다. 부분 점수가 없어 계산 실수가 곧 감점입니다.`
      : `서답형이 평균 ${(P.reduce((a, p) => a + p.essay, 0) / N).toFixed(1)}문항, ${Math.round(P.reduce((a, p) => a + p.essayPts, 0) / N)}점 나옵니다. 풀이 서술 연습이 따로 필요합니다.`]);
    const objMaxSet = [...new Set(P.map(p => p.objMax))];
    const cnts = P.map(p => p.nObjMax);
    out.push(['배점', objMaxSet.length === 1
      ? `객관식 최고 배점은 ${objMaxSet[0]}점, 시험마다 ${Math.min(...cnts) === Math.max(...cnts) ? cnts[0] + '문항' : Math.min(...cnts) + '~' + Math.max(...cnts) + '문항'}입니다.`
      : `객관식 최고 배점이 시험마다 ${objMaxSet.join('·')}점으로 달랐습니다.`]);
    const withDeep = P.filter(p => p.deep.length);
    if (withDeep.length) {
      const late = withDeep.filter(p => p.deepLate).length;
      out.push(['배치', `심화 문항이 있던 ${withDeep.length}번 중 ${late}번은 ${objOnly ? '시험 마지막 3문항' : '객관식 마지막 3문항'} 안에 심화를 몰아 두었습니다.`]);
    } else out.push(['배치', '분석한 시험에 심화 문항이 없었습니다.']);

    out.push(['변별', `실력·심화 배점은 ${Math.min(...tops)}~${Math.max(...tops)}점 (평균 ${Math.round(tops.reduce((a, b) => a + b, 0) / N)}점)입니다.`]);
    const bigShare = P.map(p => p.topBig ? Math.round(p.topBig[1]) : 0);
    const fav = P.filter(p => p.topBig).map(p => `${p.e.g}-${p.e.t} ${p.e.x} ${p.topBig[0].replace(/^[^.]*\./, '')} ${Math.round(p.topBig[1])}점`);

    return out;

        <div class="legend"><span><i class="dsw" style="background:var(--d1)"></i>기본</span><span><i class="dsw" style="background:var(--d2)"></i>응용</span><span><i class="dsw" style="background:var(--d3)"></i>실력</span><span><i class="dsw" style="background:var(--d4)"></i>심화</span></div></div>
        <div class="map">${nums}${map}</div></section>
      <div class="grid2">
        <section class="card"><h2>실력 · 심화 배점</h2><div class="bars">${bars}</div><div class="blabels">${blabels}</div></section>
        <section class="card"><h2>행동영역 배점</h2>${stacks}
          <div class="legend" style="padding-left:122px">${BK.map(k => `<span><i class="dsw" style="background:${k[2]}"></i>${k[1]}</span>`).join('')}</div></section>
      </div>
      <div class="grid2">
        <section class="card"><h2>자주 나온 유형 <small>이 학교 기록 + 다른 학교 기록</small></h2><div class="typelist">${tl.map(t => `
          <div class="t"><span class="nm">${esc(D.catalog[t.k][6])}</span><span class="cnt">${t.v.length + t.others.length}회</span>
          <span class="where">${esc(short(s))}: ${esc(t.v.join(', '))}${t.others.length ? ' · 다른 학교: ' + esc(t.others.map(o => short(o.s) + ' ' + o.no + '번').join(', ')) : ''}</span></div>`).join('')}</div></section>
        <section class="card"><h2>인근 학교에만 나온 유형 <small>같은 범위, ${esc(short(s))}중에서는 아직 안 나옴</small></h2>
          ${onlyOthers.length ? `<div class="typelist">${onlyOthers.map(t => `<div class="t"><span class="nm">${esc(D.catalog[t.k][6])}</span><span class="cnt">${t.r.length}회</span>
          <span class="where">${esc(D.catalog[t.k][1])} · ${esc(t.r.map(o => short(o.s) + ' ' + o.e.g + '-' + o.e.t + ' ' + o.e.x + ' ' + o.no + '번').join(', '))}</span></div>`).join('')}</div>
          <p class="callout">문제 제작소에서 '인근 학교만 출제' 문항을 고를 때 이 목록을 씁니다.</p>` : '<div class="empty">해당 유형이 없습니다.</div>'}</section>
      </div>
      <section class="card"><h2>4개교 비교 <small>분석된 시험 기준</small></h2><div class="tablewrap" style="border:0">
        <table><thead><tr><th>학교</th><th>분석 시험</th><th>평균 문항 수</th><th>서답형 평균 배점</th><th>실력·심화 평균</th><th>심화를 마지막에 둔 시험</th></tr></thead><tbody>${cmpRows}</tbody></table></div></section>`;
    }
    $('#main').innerHTML = `
      <div class="head"><div><div class="kicker">시험이 쌓일수록 학교의 출제 습관이 보입니다</div><h1>${esc(s)} 누적 분석</h1></div></div>
      ${pick}
      <section class="card"><h2>보관 중인 시험 <small>분석 = 문항 분석 완료 · 원본 = 시험지만 있음 · 정답 = 정답지만 있음</small></h2>
        <div class="tablewrap" style="border:0"><table class="cov"><thead><tr><th></th>${cov.map(y => `<th>${y}</th>`).join('')}</tr></thead>
        <tbody>${slots.map(sl => `<tr><th style="text-align:left">${sl.g}학년 ${sl.t}학기 ${sl.x}</th>${cov.map(y => covCell(y, sl)).join('')}</tr>`).join('')}</tbody></table></div></section>
      ${body}`;
    $('#main').querySelectorAll('.chip[data-s]').forEach(b => b.onclick = () => { curSchool = b.dataset.s; store.set('school', curSchool); renderSchool(); });
    $('#schSel').onchange = ev => { if (ev.target.value) { curSchool = ev.target.value; store.set('school', curSchool); renderSchool(); } };
  }

  // ---------- 3. 단원·유형 목록 ----------
  let curCourse = store.get('course', '중등2-1');
  function renderTypes() {
    const courses = [...new Set(D.catalog.map(c => c[1]))];
    if (!courses.includes(curCourse)) curCourse = courses[0];
    const rows = D.catalog.map((c, k) => ({ c, k })).filter(x => x.c[1] === curCourse);
    const mids = [...new Set(rows.map(x => x.c[3]))];
    const named = rows.filter(x => x.c[6]).length;
    $('#main').innerHTML = `
      <div class="head"><div><div class="kicker">수학도서관 자체 분류 · 과정 › 대단원 › 중단원 › 유형</div><h1>단원 · 유형 목록</h1></div></div>
      <div class="frow">${courses.map(c => `<button type="button" class="chip" data-c="${c}" aria-pressed="${c === curCourse}">${c}</button>`).join('')}</div>
      <p class="callout">${curCourse}: 이름이 있는 유형 ${named}개, 빈 번호 ${rows.length - named}개. 빈 번호는 받은 분석지에 아직 나오지 않은 번호입니다. ${ctx ? '유형 이름을 누르면 고칠 수 있고, 저장하면 바로 반영됩니다.' : '이름 입력은 데이터 저장(Firebase)을 연결한 뒤 이 화면에서 할 수 있습니다.'}</p>
      <section class="card tree">${mids.map(m => {
        const rs = rows.filter(x => x.c[3] === m), h = rs[0].c;
        return `<div class="mid"><h3>${esc(h[2])} › ${m}.${esc(h[4])}<span>${rs.filter(x => x.c[6]).length}/${rs.length}</span></h3>
          ${rs.map(x => { const r = REC[x.k] || []; return `<div class="trow ${x.c[6] ? '' : 'gap'}"><code>${esc(x.c[0])}</code>
            ${ctx ? `<button type="button" class="tname" data-k="${x.k}">${x.c[6] ? esc(x.c[6]) : '이름 입력 필요'}</button>` : `<span>${x.c[6] ? esc(x.c[6]) : '이름 입력 필요'}</span>`}<span class="w">${r.length ? esc(r.map(o => short(o.s) + ' ' + o.e.g + '-' + o.e.t + ' ' + o.e.x + ' ' + o.no + '번').join(', ')) : ''}</span></div>`; }).join('')}</div>`;
      }).join('')}</section>`;
    $('#main').querySelectorAll('.chip[data-c]').forEach(b => b.onclick = () => { curCourse = b.dataset.c; store.set('course', curCourse); renderTypes(); });
    if (ctx) $('#main').querySelectorAll('.tname').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, c = D.catalog[k];
      const f = document.createElement('form'); f.className = 'tedit';
      f.innerHTML = `<input id="tn-${k}" value="${esc(c[6])}" placeholder="유형 이름" aria-label="${esc(c[0])} 유형 이름"><button type="submit" class="primary sm">저장</button><button type="button" class="linkbtn" data-x>취소</button>`;
      b.replaceWith(f); const inp = f.querySelector('input'); inp.focus();
      f.querySelector('[data-x]').onclick = () => renderTypes();
      f.onsubmit = async ev => {
        ev.preventDefault(); const v = inp.value.trim();
        f.querySelector('button').disabled = true;
        try { await ctx.saveTypeName(c[0], v); c[6] = v; renderTypes(); }
        catch (e) { inp.setCustomValidity('저장하지 못했습니다: ' + e.message); inp.reportValidity(); f.querySelector('button').disabled = false; }
      };
    });
  }

  // ---------- 준비 중 화면 ----------
  const SOON = {
    register: ['시험 등록', '4단계', '직접 업로드하거나 MYBOX 폴더에서 시험지 PDF를 고르면, AI(Claude 또는 GPT)가 문항표를 채우고 원장님이 검수합니다. 보관함에서 "분석 전"인 시험이 이 과정을 거쳐 "분석 완료"가 됩니다.'],
    output: ['분석지 만들기', '3단계', '간결 A4 1장, 카톡 공유 카드, 상세 A4 2쪽 세 가지 형식을 만들고, 이미지 복사·저장·PDF로 내보냅니다. 지금 분석된 12개 시험부터 바로 만들 수 있습니다.'],
    factory: ['문제 제작소', '5단계', '학교별 누적 분석을 바탕으로 기본 2회분, 추가 2회분까지 모의고사를 만듭니다. 작년 유형 변형, 인근 학교만 출제한 유형, 아직 기록 없는 유형을 섞습니다.']
  };
  function renderSoon(v) {
    const s = SOON[v];
    $('#main').innerHTML = `<div class="head"><div><div class="kicker">${s[1]}에서 만듭니다</div><h1>${s[0]}</h1></div></div>
      <section class="card soonbox"><p style="margin:0">${s[2]}</p><a href="#archive" style="color:var(--brand);font-weight:700">시험지 보관함으로 가기</a></section>`;
  }

  // ---------- 라우팅 ----------
  function route() {
    const v = (location.hash || '#archive').slice(1) || 'archive';
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
    if (v === 'school') renderSchool();
    else if (v === 'types') renderTypes();
    else if (SOON[v]) renderSoon(v);
    else renderArchive();
    window.scrollTo(0, 0);
  }
  $('#sideNote').innerHTML = `${D.exams.length}개 시험 · ${schools.length}개 학교 · 데이터 기준일 ${esc(D.built)}`
    + (ctx ? `<br>${esc(ctx.user)} <button type="button" class="linkbtn" id="logout">로그아웃</button>` : '');
  if (ctx) $('#logout').onclick = () => ctx.signOut();
  window.addEventListener('hashchange', route);
  route();
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="boot.js"></script>

</body>
</html>
